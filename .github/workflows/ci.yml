name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` is not used: package-lock.json is generated on Windows and
      # omits the Linux-only optional deps (@emnapi/*), which makes `npm ci`
      # refuse to install here. This verifies the project builds from
      # package.json, not that the lockfile is byte-exact.
      - run: npm install --no-audit --no-fund

      # Proves the zero-dependency icon generator still runs. Deliberately not
      # byte-comparing against the committed PNGs: zlib output is not
      # guaranteed identical across Node builds, and a flaky red badge is
      # worse than no check.
      - run: node tools/make-icons.mjs

      # typecheck + vitest + MV3 build
      - run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
